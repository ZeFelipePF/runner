name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Versao SemVer para snapshot manual (ex 0.0.0-test). NAO publica release.
        required: false
        default: 0.0.0-test

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile CLIs + assinador.jar
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versao.outputs.version }}
      is_release: ${{ steps.versao.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: versao
        name: Calcular versao a partir da tag ou input
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true"             >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false"              >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build assinador.jar
        working-directory: assinador
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp package -DskipTests
          cp target/assinador.jar "../assinador-${{ steps.versao.outputs.version }}.jar"

      - name: GoReleaser snapshot (cross-compile)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.versao.outputs.version }}

      - name: Listar artefatos brutos
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: binarios-brutos
          path: |
            dist/assinatura-*
            dist/simulador-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: assinador-jar
          path: assinador-${{ steps.versao.outputs.version }}.jar
          if-no-files-found: error

  package-linux:
    name: Empacotar AppImage (Linux)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binarios-brutos
          path: dist

      - name: Instalar appimagetool (sem FUSE)
        run: |
          wget -q -O appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          echo "APPIMAGETOOL=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Construir AppImages
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          chmod +x scripts/build-appimage.sh
          mkdir -p appimages
          for binario in assinatura simulador; do
            bin_path="dist/${binario}-${VERSION}-linux-amd64"
            if [[ ! -f "$bin_path" ]]; then
              echo "Esperado: $bin_path" >&2
              ls dist/
              exit 1
            fi
            chmod +x "$bin_path"
            ./scripts/build-appimage.sh "$binario" "$VERSION" amd64 "$bin_path" appimages
          done
          ls -la appimages/

      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-linux
          path: appimages/*.AppImage
          if-no-files-found: error

  package-macos:
    name: Empacotar DMG (macOS)
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binarios-brutos
          path: dist

      - name: Construir DMGs
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          chmod +x scripts/build-dmg.sh
          mkdir -p dmgs
          for binario in assinatura simulador; do
            bin_path="dist/${binario}-${VERSION}-macos-amd64"
            if [[ ! -f "$bin_path" ]]; then
              echo "Esperado: $bin_path" >&2
              ls dist/
              exit 1
            fi
            chmod +x "$bin_path"
            ./scripts/build-dmg.sh "$binario" "$VERSION" amd64 "$bin_path" dmgs
          done
          ls -la dmgs/

      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-macos
          path: dmgs/*.dmg
          if-no-files-found: error

  package-windows:
    name: Coletar .exe (Windows)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binarios-brutos
          path: dist

      - name: Renomear binarios Windows
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          chmod +x scripts/rename-windows.sh
          mkdir -p exes
          for binario in assinatura simulador; do
            candidatos=(
              "dist/${binario}-${VERSION}-windows-amd64.exe"
              "dist/${binario}-${VERSION}-windows-amd64"
            )
            bin_path=""
            for c in "${candidatos[@]}"; do
              if [[ -f "$c" ]]; then bin_path="$c"; break; fi
            done
            if [[ -z "$bin_path" ]]; then
              echo "Nao encontrei o binario Windows para $binario" >&2
              ls dist/
              exit 1
            fi
            ./scripts/rename-windows.sh "$binario" "$VERSION" amd64 "$bin_path" exes
          done
          ls -la exes/

      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-windows
          path: exes/*.exe
          if-no-files-found: error

  release:
    name: Assinar (Cosign) e publicar release
    runs-on: ubuntu-latest
    needs: [build, package-linux, package-macos, package-windows]
    if: needs.build.outputs.is_release == 'true'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          pattern: pacotes-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: assinador-jar
          path: artefatos

      - name: Listar artefatos finais
        run: ls -la artefatos/

      - name: Gerar checksums-sha256.txt
        working-directory: artefatos
        run: sha256sum * | LC_ALL=C sort > checksums-sha256.txt

      - uses: sigstore/cosign-installer@v3

      - name: Assinar artefatos com Cosign (OIDC keyless)
        working-directory: artefatos
        run: |
          shopt -s nullglob
          for f in *; do
            case "$f" in
              *.sig|*.pem|checksums-sha256.txt) continue ;;
            esac
            echo "Assinando $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Listar release final
        run: ls -la artefatos/

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artefatos/*
          generate_release_notes: true
          body: |
            ## Sistema Runner ${{ github.ref_name }}

            Binarios assinados com Cosign (OIDC keyless) - verifique via:

            ```bash
            cosign verify-blob \
              --certificate <artefato>.pem \
              --signature <artefato>.sig \
              --certificate-identity-regexp ".*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              <artefato>
            ```

            Confira `checksums-sha256.txt` para integridade SHA-256.
