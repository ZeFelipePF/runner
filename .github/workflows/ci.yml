name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build assinatura
        working-directory: assinatura
        run: go build ./...

      - name: Test assinatura
        working-directory: assinatura
        run: go test ./... -v

      - name: Build simulador
        working-directory: simulador
        run: go build ./...

      - name: Test simulador
        working-directory: simulador
        run: go test ./... -v

  test-assinador:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make mvnw executable
        if: runner.os != 'Windows'
        working-directory: assinador
        run: chmod +x mvnw

      - name: Test assinador
        working-directory: assinador
        run: ./mvnw verify
        shell: bash

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Lint assinatura
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: assinatura

      - name: Lint simulador
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: simulador

  acceptance:
    name: Testes de aceitacao (US-01..US-05)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build assinador.jar
        working-directory: assinador
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then chmod +x mvnw; fi
          ./mvnw -B -ntp package -DskipTests

      - name: Exportar caminho da jar (HUBSAUDE_ASSINADOR_JAR)
        shell: bash
        run: echo "HUBSAUDE_ASSINADOR_JAR=$GITHUB_WORKSPACE/assinador/target/assinador.jar" >> "$GITHUB_ENV"

      - name: Aceitacao assinatura
        working-directory: assinatura
        run: go test -tags=acceptance ./cmd -run Aceitacao -v

      - name: Aceitacao simulador
        working-directory: simulador
        run: go test -tags=acceptance ./cmd -run Aceitacao -v

  release-config:
    name: Validar configuracao de release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check
